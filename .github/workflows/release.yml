name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        required: true
        type: choice
        default: ''
        options:
          - ''
          - stable
          - next
      version:
        description: Version
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Dry run
        required: false
        type: boolean
        default: false
      skip-npm-publish:
        description: Skip NPM publish
        required: false
        type: boolean
        default: false
      skip-changelog-update:
        description: Skip Changelog and GitHub release
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: vitalets/npm-release@v2
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          skip-npm-publish: ${{ inputs.skip-npm-publish }}
          skip-changelog-update: ${{ inputs.skip-changelog-update }}
          dry-run: ${{ inputs.dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
